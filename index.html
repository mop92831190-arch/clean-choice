
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLEAN CHOICE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#f5f2fa;margin:0;color:#30213f}
header{background:#54218a;color:white;padding:24px;text-align:center}
header h1{color:#ffd43b;margin:0}
main{max-width:440px;margin:35px auto;padding:15px}
.card{background:white;padding:22px;border-radius:16px;box-shadow:0 3px 15px #0001}
input,button{width:100%;padding:14px;margin:9px 0;border-radius:9px;font-size:16px}
input{border:1px solid #ddd}
button{border:0;background:#54218a;color:white;font-weight:bold}
#status{white-space:pre-wrap;line-height:1.8}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>CLEAN CHOICE</h1>
<p>نظام إدارة مغسلة السيارات</p>
</header>
<main>
<div class="card" id="loginBox">
<h2>تسجيل الدخول</h2>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button id="loginBtn">دخول</button>
<p id="status">أدخل بيانات حسابك.</p>
</div>

<div class="card hidden" id="dashboard">
<h2>مرحباً بك في CLEAN CHOICE</h2>
<p id="profileInfo"></p>
<p>تم الاتصال بقاعدة البيانات بنجاح.</p>
<button id="logoutBtn">تسجيل الخروج</button>
</div>
</main>

<script>
const SUPABASE_URL = 'https://qblfqvahjmsevucuysfe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WSnRwXiHI1iF5ZS5UpNV-Q_sYpZuOU6';

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const statusBox = document.getElementById('status');
const loginBox = document.getElementById('loginBox');
const dashboard = document.getElementById('dashboard');

async function showProfile(user) {
  const {data, error} = await db
    .from('profiles')
    .select('full_name, role, active')
    .eq('id', user.id)
    .single();

  if(error) {
    statusBox.textContent = 'تعذر قراءة الملف الشخصي: ' + error.message;
    return;
  }

  if(!data || !data.active) {
    statusBox.textContent = 'الحساب غير مفعّل. راجع المالك.';
    return;
  }

  loginBox.classList.add('hidden');
  dashboard.classList.remove('hidden');

  document.getElementById('profileInfo').textContent =
    'الاسم: ' + (data.full_name || 'المستخدم') +
    ' | الصلاحية: ' + data.role;
}

document.getElementById('loginBtn').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if(!email || !password) {
    statusBox.textContent = 'أدخل البريد الإلكتروني وكلمة المرور.';
    return;
  }

  statusBox.textContent = 'جارٍ تسجيل الدخول...';

  const {data, error} = await db.auth.signInWithPassword({
    email, password
  });

  if(error) {
    statusBox.textContent = 'تعذر الدخول: ' + error.message;
    return;
  }

  await showProfile(data.user);
};

document.getElementById('logoutBtn').onclick = async () => {
  await db.auth.signOut();
  dashboard.classList.add('hidden');
  loginBox.classList.remove('hidden');
  statusBox.textContent = 'تم تسجيل الخروج.';
};

(async () => {
  const {data} = await db.auth.getSession();
  if(data.session) await showProfile(data.session.user);
})();
</script>
</body>
</html>
