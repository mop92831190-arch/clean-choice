
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLEAN CHOICE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#17121f;
  color:#fff;
}
header{
  background:#54218a;
  padding:22px 15px;
  text-align:center;
  border-bottom:3px solid #ffd43b;
}
header h1{color:#ffd43b;margin:0;font-size:27px}
header p{margin:8px 0 0}
main{max-width:850px;margin:20px auto;padding:12px}
.card{
  background:#241b30;
  border:1px solid #49345d;
  border-radius:15px;
  padding:20px;
  margin-bottom:17px;
}
h2,h3{color:#ffd43b}
input,select,button{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:9px;
  font-size:15px;
}
input,select{
  border:1px solid #665477;
  background:#17121f;
  color:white;
}
button{
  border:0;
  background:#ffd43b;
  color:#30213f;
  font-weight:bold;
  cursor:pointer;
}
button.secondary{
  background:#54218a;
  color:white;
  border:1px solid #8060a0;
}
button.danger{background:#a83a4c;color:white}
.hidden{display:none!important}
.status{
  white-space:pre-wrap;
  line-height:1.7;
  color:#ffd43b;
}
.vehicle{
  background:#30243e;
  border:1px solid #60457a;
  border-radius:12px;
  padding:13px;
  margin:10px 0;
  line-height:1.8;
}
.small{font-size:13px;color:#c9b9d7}
hr{border:0;border-top:1px solid #574366;margin:20px 0}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
@media(max-width:520px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <h1>CLEAN CHOICE</h1>
  <p>نظام إدارة مغسلة السيارات</p>
</header>

<main>

<!-- LOGIN -->
<div class="card" id="loginBox">
  <h2>تسجيل الدخول</h2>
  <input id="email" type="email" placeholder="البريد الإلكتروني">
  <input id="password" type="password" placeholder="كلمة المرور">
  <button id="loginBtn">دخول</button>
  <p id="loginStatus" class="status">أدخل بيانات حسابك.</p>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

  <div class="card">
    <h2>لوحة التحكم</h2>
    <p id="profileInfo"></p>
    <p class="small">تم الاتصال بقاعدة البيانات بنجاح.</p>
    <button class="secondary" id="logoutBtn">تسجيل الخروج</button>
  </div>

  <!-- CUSTOMER SEARCH -->
  <div class="card">
    <h2>العملاء والسيارات</h2>

    <label>البحث برقم الهاتف</label>
    <input id="customerPhone" type="tel" placeholder="أدخل رقم هاتف العميل">
    <button id="searchCustomerBtn">بحث عن العميل</button>
    <p id="customerStatus" class="status"></p>

    <div id="customerDetails" class="hidden">
      <hr>
      <h3>بيانات العميل</h3>
      <p id="customerInfo"></p>

      <h3>سيارات العميل</h3>
      <div id="vehicleList"></div>

      <hr>
      <h3>إضافة سيارة جديدة</h3>

      <input id="plateNumber" placeholder="رقم لوحة السيارة">
      <input id="vehicleType" placeholder="نوع السيارة">
      <input id="vehicleModel" placeholder="الموديل">
      <input id="vehicleColor" placeholder="اللون">

      <label>حجم السيارة</label>
      <select id="vehicleSize">
        <option value="">اختر الحجم</option>
        <option value="small">صغيرة</option>
        <option value="large">كبيرة</option>
      </select>

      <button id="addVehicleBtn">حفظ السيارة</button>
    </div>

    <div id="newCustomerBox" class="hidden">
      <hr>
      <h3>تسجيل عميل جديد</h3>
      <input id="customerName" placeholder="اسم العميل">
      <input id="customerEmail" type="email" placeholder="البريد الإلكتروني (اختياري)">
      <button id="addCustomerBtn">حفظ العميل</button>
    </div>

    <p id="actionStatus" class="status"></p>
  </div>

  <!-- SUBSCRIPTIONS -->
  <div class="card">
    <h2>بيع اشتراك سيارة</h2>
    <p class="small">ابحث عن العميل أولاً، ثم اختر إحدى سياراته.</p>

    <label>السيارة</label>
    <select id="subscriptionVehicle">
      <option value="">اختر سيارة</option>
    </select>

    <label>نوع الاشتراك</label>
    <select id="subscriptionPeriod">
      <option value="daily">يومي - غسلة واحدة</option>
      <option value="weekly">أسبوعي - خصم 5%</option>
      <option value="monthly">شهري - خصم 10%</option>
    </select>

    <label>عدد الغسلات</label>
    <input id="subscriptionWashes" type="number" min="1" value="1">

    <label>طريقة الدفع</label>
    <select id="subscriptionPayment">
      <option value="cash">نقداً</option>
      <option value="card">بطاقة</option>
      <option value="other">أخرى</option>
    </select>

    <p id="subscriptionPrice" class="status">اختر السيارة لحساب السعر.</p>
    <button id="sellSubscriptionBtn">تسجيل الاشتراك</button>
    <p id="subscriptionStatus" class="status"></p>
  </div>

</div>
</main>

<script>
const SUPABASE_URL =
'https://qblfqvahjmsevucuysfe.supabase.co';

const SUPABASE_KEY =
'sb_publishable_WSnRwXiHI1iF5ZS5UpNV-Q_sYpZuOU6';

const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $ = id => document.getElementById(id);

let currentCustomerId = null;
let currentCustomer = null;
let currentVehicles = [];
let currentUserRole = null;

function message(id,text){
  $(id).textContent = text;
}

async function showProfile(user){
  message('loginStatus','جارٍ التحقق من الحساب...');

  const {data,error} = await db
    .from('profiles')
    .select('full_name,role,active')
    .eq('id',user.id)
    .single();

  if(error){
    message('loginStatus','تعذر قراءة الملف الشخصي: '+error.message);
    return;
  }

  if(!data || !data.active ||
     !['owner','employee'].includes(data.role)){
    message('loginStatus','الحساب غير مفعّل أو لا يملك صلاحية الدخول.');
    return;
  }

  currentUserRole = data.role;

  $('loginBox').classList.add('hidden');
  $('dashboard').classList.remove('hidden');

  $('profileInfo').textContent =
    'الاسم: '+(data.full_name || 'المستخدم')+
    ' | الصلاحية: '+data.role;
}

// LOGIN
$('loginBtn').onclick = async ()=>{
  const email = $('email').value.trim();
  const password = $('password').value;

  if(!email || !password){
    message('loginStatus','أدخل البريد وكلمة المرور.');
    return;
  }

  message('loginStatus','جارٍ تسجيل الدخول...');

  const {data,error} = await db.auth.signInWithPassword({
    email,password
  });

  if(error){
    message('loginStatus','تعذر الدخول: '+error.message);
    return;
  }

  await showProfile(data.user);
};

// LOGOUT
$('logoutBtn').onclick = async ()=>{
  await db.auth.signOut();
  location.reload();
};

// SEARCH CUSTOMER
$('searchCustomerBtn').onclick = async ()=>{
  const phone = $('customerPhone').value.trim();

  if(!phone){
    message('customerStatus','أدخل رقم الهاتف أولاً.');
    return;
  }

  currentCustomerId = null;
  currentCustomer = null;
  currentVehicles = [];

  $('customerDetails').classList.add('hidden');
  $('newCustomerBox').classList.add('hidden');

  message('customerStatus','جارٍ البحث...');
  message('actionStatus','');

  const {data,error} = await db
    .from('customers')
    .select('id,customer_number,full_name,phone,email')
    .eq('phone',phone)
    .maybeSingle();

  if(error){
    message('customerStatus','خطأ: '+error.message);
    return;
  }

  if(!data){
    message('customerStatus','العميل غير موجود. يمكنك تسجيله جديداً.');
    $('newCustomerBox').classList.remove('hidden');
    return;
  }

  currentCustomerId = data.id;
  currentCustomer = data;

  $('customerDetails').classList.remove('hidden');
  $('newCustomerBox').classList.add('hidden');

  $('customerInfo').textContent =
    'رقم العميل: '+data.customer_number+
    ' | الاسم: '+data.full_name+
    ' | الهاتف: '+data.phone;

  message('customerStatus','تم العثور على العميل.');
  await loadVehicles();
};

// CREATE CUSTOMER
$('addCustomerBtn').onclick = async ()=>{
  const full_name = $('customerName').value.trim();
  const phone = $('customerPhone').value.trim();
  const email = $('customerEmail').value.trim();

  if(!full_name || !phone){
    message('actionStatus','أدخل الاسم ورقم الهاتف.');
    return;
  }

  message('actionStatus','جارٍ حفظ العميل...');

  const {data,error} = await db
    .from('customers')
    .insert({
      full_name,
      phone,
      email:email || null
    })
    .select('id,customer_number,full_name,phone,email')
    .single();

  if(error){
    message('actionStatus','تعذر الحفظ: '+error.message);
    return;
  }

  currentCustomerId = data.id;
  currentCustomer = data;

  $('customerDetails').classList.remove('hidden');
  $('newCustomerBox').classList.add('hidden');

  $('customerInfo').textContent =
    'رقم العميل: '+data.customer_number+
    ' | الاسم: '+data.full_name+
    ' | الهاتف: '+data.phone;

  message('customerStatus','تم تسجيل العميل بنجاح.');
  message('actionStatus','أضف سيارات العميل الآن.');

  await loadVehicles();
};

// LOAD VEHICLES
async function loadVehicles(){
  if(!currentCustomerId) return;

  const {data,error} = await db
    .from('vehicles')
    .select('id,plate_number,vehicle_type,vehicle_model,color,vehicle_size')
    .eq('customer_id',currentCustomerId)
    .order('created_at',{ascending:false});

  if(error){
    message('actionStatus','تعذر تحميل السيارات: '+error.message);
    return;
  }

  currentVehicles = data || [];

  const list = $('vehicleList');
  list.replaceChildren();

  const selector = $('subscriptionVehicle');
  selector.replaceChildren();

  const firstOption = document.createElement('option');
  firstOption.value = '';
  firstOption.textContent = 'اختر سيارة';
  selector.appendChild(firstOption);

  if(!currentVehicles.length){
    list.textContent = 'لا توجد سيارات مسجلة لهذا العميل.';
  }

  for(const vehicle of currentVehicles){
    const item = document.createElement('div');
    item.className = 'vehicle';

    const title = document.createElement('strong');
    title.textContent = 'لوحة: '+vehicle.plate_number;
    item.appendChild(title);

    const details = document.createElement('p');
    details.textContent =
      'النوع: '+(vehicle.vehicle_type || '-')+
      ' | الموديل: '+(vehicle.vehicle_model || '-')+
      ' | اللون: '+(vehicle.color || '-')+
      ' | الحجم: '+(vehicle.vehicle_size === 'small' ? 'صغيرة' :
      vehicle.vehicle_size === 'large' ? 'كبيرة' : 'غير محدد');

    item.appendChild(details);

    const walletResult = await db
      .from('subscription_wallets')
      .select('washes_balance')
      .eq('vehicle_id',vehicle.id)
      .maybeSingle();

    const balance = walletResult.data ?
      walletResult.data.washes_balance : 0;

    const balanceText = document.createElement('p');
    balanceText.textContent = 'رصيد الاشتراك: '+balance+' غسلة';
    balanceText.style.color = '#ffd43b';
    item.appendChild(balanceText);

    list.appendChild(item);

    const option = document.createElement('option');
    option.value = vehicle.id;
    option.textContent =
      vehicle.plate_number+' - '+
      (vehicle.vehicle_size === 'small' ? 'صغيرة' :
       vehicle.vehicle_size === 'large' ? 'كبيرة' : 'الحجم غير محدد');

    selector.appendChild(option);
  }

  updateSubscriptionPrice();
}

// ADD VEHICLE
$('addVehicleBtn').onclick = async ()=>{
  if(!currentCustomerId){
    message('actionStatus','ابحث عن العميل أولاً.');
    return;
  }

  const plate_number = $('plateNumber').value.trim();
  const vehicle_size = $('vehicleSize').value;

  if(!plate_number || !vehicle_size){
    message('actionStatus','أدخل رقم اللوحة وحجم السيارة.');
    return;
  }

  message('actionStatus','جارٍ حفظ السيارة...');

  const {error} = await db
    .from('vehicles')
    .insert({
      customer_id:currentCustomerId,
      plate_number,
      vehicle_type:$('vehicleType').value.trim() || null,
      vehicle_model:$('vehicleModel').value.trim() || null,
      color:$('vehicleColor').value.trim() || null,
      vehicle_size
    });

  if(error){
    message('actionStatus','تعذر حفظ السيارة: '+error.message);
    return;
  }

  $('plateNumber').value = '';
  $('vehicleType').value = '';
  $('vehicleModel').value = '';
  $('vehicleColor').value = '';
  $('vehicleSize').value = '';

  message('actionStatus','تمت إضافة السيارة بنجاح.');
  await loadVehicles();
};

// SUBSCRIPTION PRICE PREVIEW
function updateSubscriptionPrice(){
  const vehicle = currentVehicles.find(
    v=>v.id === $('subscriptionVehicle').value
  );

  const period = $('subscriptionPeriod').value;
  const washes = Number($('subscriptionWashes').value);

  if(period === 'daily'){
    $('subscriptionWashes').value = 1;
    $('subscriptionWashes').disabled = true;
  }else{
    $('subscriptionWashes').disabled = false;
  }

  if(!vehicle){
    message('subscriptionPrice','اختر السيارة لحساب السعر.');
    return;
  }

  if(!vehicle.vehicle_size){
    message('subscriptionPrice','حدد حجم السيارة أولاً.');
    return;
  }

  const base = vehicle.vehicle_size === 'small' ? 1.890 : 2.390;
  const count = period === 'daily' ? 1 : washes;

  if(!Number.isInteger(count) || count < 1){
    message('subscriptionPrice','أدخل عدد غسلات صحيح.');
    return;
  }

  const discount =
    period === 'weekly' ? 0.95 :
    period === 'monthly' ? 0.90 : 1;

  const total = (base * count * discount).toFixed(3);

  message(
    'subscriptionPrice',
    'سعر الغسلة: '+base.toFixed(3)+
    ' ر.ع | العدد: '+count+
    ' | الإجمالي: '+total+' ر.ع'
  );
}

$('subscriptionVehicle').onchange = updateSubscriptionPrice;
$('subscriptionPeriod').onchange = updateSubscriptionPrice;
$('subscriptionWashes').oninput = updateSubscriptionPrice;

// SELL SUBSCRIPTION
$('sellSubscriptionBtn').onclick = async ()=>{
  const vehicleId = $('subscriptionVehicle').value;
  const period = $('subscriptionPeriod').value;
  const washes = Number($('subscriptionWashes').value);
  const payment = $('subscriptionPayment').value;

  if(!vehicleId){
    message('subscriptionStatus','اختر سيارة أولاً.');
    return;
  }

  if(!Number.isInteger(washes) || washes < 1){
    message('subscriptionStatus','أدخل عدد غسلات صحيح.');
    return;
  }

  if(period === 'daily' && washes !== 1){
    message('subscriptionStatus','الاشتراك اليومي غسلة واحدة.');
    return;
  }

  const vehicle = currentVehicles.find(v=>v.id === vehicleId);

  if(!vehicle || !vehicle.vehicle_size){
    message('subscriptionStatus','يجب تحديد حجم السيارة أولاً.');
    return;
  }

  if(!confirm('هل تريد تأكيد تسجيل الاشتراك لهذه السيارة؟')){
    return;
  }

  message('subscriptionStatus','جارٍ تسجيل الاشتراك...');

  const {data,error} = await db.rpc(
    'sell_vehicle_subscription',
    {
      p_vehicle_id:vehicleId,
      p_period_type:period,
      p_washes:period === 'daily' ? 1 : washes,
      p_payment_method:payment
    }
  );

  if(error){
    message('subscriptionStatus','تعذر تسجيل الاشتراك: '+error.message);
    return;
  }

  const result = Array.isArray(data) ? data[0] : data;

  if(!result){
    message('subscriptionStatus','لم تصل نتيجة تسجيل الاشتراك.');
    return;
  }

  message(
    'subscriptionStatus',
    'تم تسجيل الاشتراك بنجاح!\n'+
    'المبلغ: '+Number(result.total_amount).toFixed(3)+' ر.ع\n'+
    'الرصيد الجديد: '+result.new_balance+' غسلة'
  );

  await loadVehicles();
}

// CHECK EXISTING SESSION
(async()=>{
  const {data,error} = await db.auth.getSession();

  if(error){
    message('loginStatus','تعذر التحقق من الجلسة: '+error.message);
    return;
  }

  if(data.session){
    await showProfile(data.session.user);
  }
})();
</script>

</body>
</html>
